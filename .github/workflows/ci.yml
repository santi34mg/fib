name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --check

  frontend:
    name: Frontend (no LLVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Check (no default features)
        run: cargo check --no-default-features

      - name: Test (no default features)
        # e2e.rs is `#![cfg(feature = "llvm")]`, so this exercises the
        # frontend unit tests only — it catches silent-noop feature gating.
        run: cargo test --no-default-features

  build_and_test:
    name: Build and run tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 21

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        id: cache-rs
        uses: actions/cache@v5
        env:
          cache-name: cache-rs-dependencies
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Includes the workflow file and the pinned toolchain (`rust-toolchain.toml`)
          # so LLVM/toolchain bumps invalidate the cache, not just Cargo.lock changes.
          key: ${{ runner.os }}-llvm21-cargo-${{ hashFiles('**/Cargo.lock', '.github/workflows/ci.yml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-llvm21-cargo-

      # Fail fast on formatting: cheaper than check/clippy/build.
      - name: Format
        run: cargo fmt --check

      - name: Check
        run: cargo check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      - name: Test (all features)
        run: cargo test --all-features

  audit:
    name: Security audit (advisory, non-blocking)
    runs-on: ubuntu-latest
    # Advisory only: inkwell/LLVM advisories must not block unrelated PRs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        run: cargo audit

  deny:
    name: Dependency license check (advisory, non-blocking)
    runs-on: ubuntu-latest
    # Advisory only, like `audit`: license/duplicate violations are surfaced
    # in PRs but never gate merges while inkwell/LLVM remain holdouts.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check
        run: cargo deny check

  coverage:
    name: Coverage (advisory, non-blocking)
    runs-on: ubuntu-latest
    # Advisory only: coverage is informational, never gating. Do NOT chase
    # 100% line coverage on the lowering files — it incentivizes
    # tautological tests.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 21

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Coverage (advisory)
        run: cargo tarpaulin --out Stdout --timeout 300
