name: Release bundle

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/dist.rs'
      - 'scripts/install.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'library/**'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: sh
    steps:
      - uses: actions/checkout@v4
      - uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 21
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Build, archive and test extracted bundle
        env:
          FIB_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: cargo run --locked --no-default-features --bin fib-dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-bundle
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-bundle
          path: dist
      - name: Attach binary bundle and checksum
        shell: sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
