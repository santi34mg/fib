[package]
name = "fibc"
default-run = "fibc"
version = "0.1.1"
edition = "2024"
license = "MIT"

[[bin]]
name = "fib-install"
path = "scripts/install.rs"

[features]
default = ["llvm"]
llvm = ["inkwell"]

[dependencies]
anyhow = "1.0.103"
num-bigint = "0.4.8"
num-traits = "0.2.19"
rustc_apfloat = "=0.2.3"

serde_json = "1.0"

serde = { version = "1.0", features = ["derive"] }
toml = "0.9.8"
clap = { version = "4.5.60", features = ["derive"]}
regex = "1.12.3"
inkwell = { version = "0.8.0", features = ["llvm21-1"], optional = true }
walkdir = "2.3.4"
petgraph = "0.6.1"
either = "1.15.0"
indextree = "4.7.4"
tempfile = "3"
