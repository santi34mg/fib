[toolchain]
# Pinned to the stable that last went green in CI (rustc 1.98.0, 2026-08-18).
# This pin doubles as the MSRV policy: any other toolchain may build but is
# unsupported. GitHub Actions pins the matching dtolnay/rust-toolchain ref in
# ci.yml; local toolchain managers honor this file. Bump deliberately, never by
# drift.
channel = "1.98.0"
components = ["rustfmt", "clippy"]
